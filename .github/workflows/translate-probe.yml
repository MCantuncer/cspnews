name: Translate probe
on:
  push:
    branches: [feature/translate-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/hotnews/translate/requirements.txt
      - run: time pip install -r packages/hotnews/translate/requirements.txt
      - run: time python packages/hotnews/translate/translate.py < probe/probe.json
      - run: time python packages/hotnews/translate/translate.py < probe/probe.json
