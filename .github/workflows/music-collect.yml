name: Music Collect

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Indie Dance sources
        run: |
          set +e
          for q in "indie dance" "indie%20dance" "nu disco indie dance" "indie electronic" "indie dance deezer"; do
            echo "== deezer playlist search: $q"
            curl -s "https://api.deezer.com/search/playlist?q=$(echo $q | sed 's/ /+/g')&limit=50" | jq -r '.data[] | "\(.id)\t\(.nb_tracks)\t\(.user.name // "-")\t\(.title)"' | head -40
          done
          echo "== deezer editorial genres"; curl -s https://api.deezer.com/genre | jq -c '.data[] | [.id,.name]'
          echo "== deezer user search editor"; curl -s "https://api.deezer.com/search/user?q=deezer%20editor&limit=50" | jq -r '.data[] | "\(.id)\t\(.name)"'
          echo "== bandcamp discover indie-dance"; curl -s -o /tmp/bc.json -w "%{http_code}\n" -H 'Content-Type: application/json' -X POST https://bandcamp.com/api/discover/1/discover_web -d '{"category_id":0,"tag_norm_names":["indie-dance"],"geoname_id":0,"slice":"top","cursor":"*","size":30,"include_result_types":["a","s"]}'; head -c 1500 /tmp/bc.json; echo
          echo "== beatport indie dance"; curl -s -o /dev/null -w "%{http_code}\n" https://www.beatport.com/genre/indie-dance/37/top-100
          echo "== traxsource"; curl -s -o /dev/null -w "%{http_code}\n" https://www.traxsource.com/genre/23/indie-dance-nu-disco/top
          true
