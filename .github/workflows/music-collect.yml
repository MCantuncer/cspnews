name: Music Collect

# Reads the rap and techno charts for the day's music edition and saves them on the `candidates`
# branch for the evening writer (docs/music.md):
#
#   music/history/<yyyy-mm-dd>.json     every chart's places and plays, the history the
#                                       "climbing", "plays at 2x" and "back after 90 days" numbers
#                                       are measured against
#   music/candidates/<yyyy-mm-dd>.json  the ranked candidates per genre, with previews and
#                                       the numbers a reason may quote
#
# Runs at 16:30 Istanbul time every day, and by hand from the Actions tab.

on:
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/music-collect.yml'

permissions:
  contents: write

concurrency:
  group: music-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cspnews/music... build

      - name: Earlier history
        run: |
          mkdir -p "$RUNNER_TEMP/history"
          if git fetch origin candidates 2>/dev/null; then
            git archive FETCH_HEAD music/history 2>/dev/null | tar -x -C "$RUNNER_TEMP" --strip-components=1 || true
          fi
          ls "$RUNNER_TEMP/history" | tail -3

      - name: Probe techno sources (temporary)
        if: github.event_name == 'pull_request'
        run: |
          set +e
          for u in \
            "https://www.junodownload.com/techno/charts/bestsellers/this-week/" \
            "https://www.junodownload.com/techno/charts/hype/" \
            "https://www.decks.de/decks/workfloor/lists/top.php?wg=techno" \
            "https://www.redeyerecords.co.uk/techno-electro/" \
            "https://bandcamp.com/api/hub/2/dig_deeper?tag=techno" \
            "https://www.junodownload.com/techno/" \
            "https://www.traxsource.com/genre/18/techno/top" \
            "https://www.traxsource.com/genre/18/techno" \
            "https://www.1001tracklists.com/charts/weekly/techno/index.html" \
            "https://api.deezer.com/search/playlist?q=techno%20top" ; do
            code=$(curl -sL -o /tmp/p.html -w '%{http_code}' -A 'cspnews-music-collect/1.0 (+https://www.cspnews.app)' "$u"; true)
            echo "=== $code $u $(wc -c < /tmp/p.html) bytes"
            grep -oiE '(bpm[^<]{0,40}|<title>[^<]*|class="[^"]*(track|title|artist)[^"]*"[^>]*>[^<]{0,60})' /tmp/p.html | head -25
            head -c 600 /tmp/p.html | tr '\n' ' '; echo
          done

      - name: Read the charts
        run: |
          DATE=$(TZ=Europe/Istanbul date +%F)
          echo "DATE=$DATE" >> "$GITHUB_ENV"
          pnpm --filter @cspnews/music collect-music "$RUNNER_TEMP/history" "$RUNNER_TEMP/candidates/$DATE.json" "$DATE"

      - name: Save on the candidates branch
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git fetch origin candidates:candidates 2>/dev/null && git switch candidates || git switch --orphan candidates
          mkdir -p music/history music/candidates
          cp "$RUNNER_TEMP/history/$DATE.json" music/history/
          cp "$RUNNER_TEMP/candidates/$DATE.json" music/candidates/
          test -f vercel.json || echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git add music vercel.json
          git commit -m "Music Collect $DATE"
          for attempt in 1 2 3; do
            git push origin candidates && break
            git pull --rebase origin candidates
          done

      - name: Show the candidates (pull requests only)
        if: github.event_name == 'pull_request'
        run: cat "$RUNNER_TEMP/candidates/$DATE.json"
