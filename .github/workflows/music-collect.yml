name: Music Collect

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Bandcamp
        run: |
          set +e
          for slice in top new; do
            echo "== bandcamp $slice indie-dance"
            curl -s -H 'Content-Type: application/json' -X POST https://bandcamp.com/api/discover/1/discover_web -d "{\"category_id\":0,\"tag_norm_names\":[\"indie-dance\"],\"geoname_id\":0,\"slice\":\"$slice\",\"cursor\":\"*\",\"size\":40,\"include_result_types\":[\"a\",\"s\"]}" > /tmp/$slice.json
            jq -r '.results[] | "\(.itemType)\t\(.bandName)\t\(.title)\t\(.releaseDate)\t\(.playerData.title // "-")\t\(.playerData.artistName // "-")\t\(.playerData.streamUrl // .playerData.file // "-" | tostring | .[0:80])"' /tmp/$slice.json
          done
          echo "== keys"; jq '.results[0] | keys' /tmp/top.json; jq '.results[0].playerData | keys' /tmp/top.json; jq -c '.results[0].playerData' /tmp/top.json | head -c 2500; echo
          jq 'del(.results)' /tmp/top.json
          true
